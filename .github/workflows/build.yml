name: Build & publish images

# Test gates first, then build the backend, web, and proxy images and push them
# to GHCR. The build job only runs if the checks pass, so a regression never
# reaches an image. Publishing happens in CI (using the Actions token), so no
# local `docker login` / write:packages PAT is needed — `git push` ships a
# release and the deploy host just pulls :latest. Matches the workflow used by
# the other jwapps-app self-hosted projects (colloqui, notabula, kryptovox).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile (syntax)
        run: python -m compileall -q app
      - name: Import smoke test (every router + module resolves)
        run: python -c "import app.main"

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Type-check and build
        working-directory: web
        run: npm run build

  build-images:
    needs: [backend-checks, web-checks]
    # Publish only from main / version tags, never from PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: ./Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: proxy
            context: .
            dockerfile: ./Dockerfile.proxy
    steps:
      - uses: actions/checkout@v4
      # arm64 layers build under QEMU emulation — slower, but the images then run
      # natively on both x86_64 hosts and the Apple-Silicon deploy Mac.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # -> ghcr.io/jwapps-app/bibliocapsa-{backend,web,proxy}
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
